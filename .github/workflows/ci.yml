name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  validate:
    name: Tests and Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Docker build validation
        run: |
          docker build \
            --build-arg APP_VERSION="$(cat VERSION)" \
            --build-arg GIT_COMMIT="${{ github.sha }}" \
            --build-arg GIT_REPOSITORY="${{ github.server_url }}/${{ github.repository }}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t student-ml-api:ci-check \
            .
        # Intentionally does NOT push to any registry
